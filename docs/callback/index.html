<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citadel — Authorization Callback</title>
  
  <!-- Explicit Versioned Brand Assets -->
  <link href="https://distribute.kartikarora.me/css/kartikarora.2.0.0.css" rel="stylesheet">
  <script src="https://distribute.kartikarora.me/js/kartikarora.2.0.0.js" defer></script>

  <!-- Curated Fonts: Chivo Display & Body, JetBrains Mono Code -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chivo:ital,wght@0,300..900;1,400&family=JetBrains+Mono:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  
  <link rel="icon" href="../favicon.ico" sizes="48x48">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="manifest" href="../site.webmanifest">
  
  <style>
    :root {
      --color-signal: #0084c7;
      --color-signal-secondary: #e6b800;
      --color-paper: #ffffff;
      --color-paper-alt: #f4f6fa;
      --color-paper-sunken: #eaeef4;
      --color-rule: #d0d7de;
      --color-rule-strong: #30363d;
      --shadow-block: 4px 4px 0px var(--color-rule-strong);
      --shadow-block-secondary: 4px 4px 0px var(--color-signal-secondary);
      --font-display: 'Chivo', system-ui, sans-serif;
      --font-sans: 'Chivo', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-signal: #00f0ff;
        --color-signal-secondary: #ffe600;
        --color-paper: #070a10;
        --color-paper-alt: #121824;
        --color-paper-sunken: #04060a;
        --color-rule: #1f242c;
        --color-rule-strong: #30363d;
        --shadow-block: 4px 4px 0px var(--color-rule-strong);
        --shadow-block-secondary: 4px 4px 0px var(--color-signal-secondary);
      }
    }

    html, body {
      overflow-x: clip;
      background-color: var(--color-paper);
      color: var(--color-ink);
      font-family: var(--font-sans);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .callback-card {
      background: var(--color-paper-alt);
      border: 2px solid var(--color-rule-strong);
      border-radius: var(--border-radius, 6px);
      padding: var(--space-xl) var(--space-xl);
      text-align: center;
      max-width: var(--max-width-narrow, 640px);
      box-shadow: var(--shadow-block);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .callback-card:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px var(--color-signal-secondary);
    }

    .callback-icon {
      width: 48px;
      height: 48px;
      aspect-ratio: 1 / 1;
      background: var(--color-signal);
      color: #000000;
      border: 2px solid var(--color-rule-strong);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin: 0 auto var(--space-md);
      box-shadow: 3px 3px 0px var(--color-signal-secondary);
    }

    .callback-title {
      font-family: var(--font-display);
      font-size: var(--text-title, 24px);
      margin-bottom: var(--space-xs);
      font-weight: 900;
      letter-spacing: -0.03em;
      color: var(--color-ink);
      text-wrap: balance;
    }

    .callback-desc {
      color: var(--color-ink-muted);
      font-size: var(--text-sm, 14px);
      line-height: 1.5;
      margin-bottom: var(--space-lg);
      text-wrap: pretty;
    }

    .callback-code {
      font-family: var(--font-mono);
      font-size: var(--text-xs, 12px);
      background: var(--color-paper-sunken);
      padding: var(--space-xs) var(--space-sm);
      border-radius: var(--border-radius-sm, 4px);
      border: 2px solid var(--color-rule-strong);
      border-left: 4px solid var(--color-signal);
      color: var(--color-signal);
      display: inline-block;
      box-shadow: 2px 2px 0px var(--color-rule-strong);
    }

    a:focus-visible, button:focus-visible {
      outline: 2px solid var(--color-focus);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="callback-card">
    <div class="callback-icon">
      <span class="material-symbols-outlined">check_circle</span>
    </div>
    <h1 class="callback-title">Citadel Authorization Complete</h1>
    <p class="callback-desc">Your authentication request was processed. You can close this window and return to the Citadel desktop application.</p>
    <div class="callback-code">citadel://auth/callback</div>
  </div>
</body>
</html>
