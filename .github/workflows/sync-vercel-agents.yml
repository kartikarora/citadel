name: Sync Vercel Agent Registry

on:
  schedule:
    # Run once daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-agents:
    name: Compare & Sync Missing Agents
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Citadel
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compare with vercel-labs/skills
        id: sync
        run: python3 scripts/sync_vercel_agents.py

      - name: Create or Update Pull Request
        if: steps.sync.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MISSING_COUNT: ${{ steps.sync.outputs.missing_count }}
          MISSING_IDS: ${{ steps.sync.outputs.missing_ids }}
        run: |
          BRANCH="chore/sync-vercel-agents"
          TITLE="chore: sync ${MISSING_COUNT} missing agent(s) from vercel-labs/skills"
          BODY=$(cat <<EOF
          Automated daily one-way sync from [\`vercel-labs/skills\` (\`src/agents.ts\`)](https://github.com/vercel-labs/skills/blob/main/src/agents.ts).

          ### Added to \`AgentRegistry.swift\`
          - \`${MISSING_IDS}\`

          > Citadel-specific agents (such as \`.matilda\` and \`.android-studio\`) are preserved and never contributed back upstream.
          EOF
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add Sources/CitadelCore/AgentRegistry.swift
          git commit -m "chore: sync missing agents from vercel-labs/skills"
          git push --force origin "$BRANCH"

          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [[ -n "$EXISTING_PR" ]]; then
            gh pr edit "$EXISTING_PR" --title "$TITLE" --body "$BODY"
          else
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body "$BODY"
          fi
