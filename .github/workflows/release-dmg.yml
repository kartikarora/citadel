name: Release & Build DMG

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

jobs:
  build-mac-dmg:
    name: Build macOS DMG
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Run Test Suite
        run: swift run citadel-tests

      - name: Build Application & Package DMG
        env:
          CITADEL_GITHUB_CLIENT_ID: ${{ secrets.CITADEL_GITHUB_CLIENT_ID }}
          CITADEL_GITHUB_CLIENT_SECRET: ${{ secrets.CITADEL_GITHUB_CLIENT_SECRET }}
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ -z "$VERSION" || "$VERSION" == "refs/heads/"* ]]; then
            VERSION="1.0.0-snapshot"
          fi
          # Strip leading 'v' if present
          VERSION="${VERSION#v}"
          ./scripts/build_dmg.sh "$VERSION"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Citadel-macOS-Release
          path: |
            dist/*.dmg
            dist/*.tar.gz

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.dmg
            dist/*.tar.gz
          generate_release_notes: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Tap
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          DMG_FILE=$(ls dist/Citadel-*.dmg | head -n 1)
          TAR_FILE=$(ls dist/citadel-*.tar.gz | head -n 1)
          ./scripts/update_homebrew_tap.sh "$VERSION" "$DMG_FILE" "$TAR_FILE" "kartikarora/homebrew-tap" || echo "Warning: Homebrew tap update skipped (check token permissions or repo existence)"
