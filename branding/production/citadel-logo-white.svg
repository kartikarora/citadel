<svg fill="#ffffff" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Citadel Logo - The Neural Citadel</title>
  
  <!-- 1. Outer Fortress Shield Silhouette in Deep Midnight Slate (#0f172a) -->
  <path fill="#ffffff" d="
    M 128,24
    L 214,64
    C 214,146 186,204 128,232
    C 70,204 42,146 42,64
    Z
  "/>
  
  <!-- 2. Dark Indigo Secondary Armor Plate (#1e1b4b) -->
  <path fill="#ffffff" d="
    M 128,44
    L 194,76
    C 194,144 172,192 128,216
    C 84,192 62,144 62,76
    Z
  "/>

  <!-- 3. The Neural Synapse Connections (Skills to Agents Network) -->
  <!-- Outer loop connections -->
  <path stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" d="
    M 128,68 L 86,112
    M 128,68 L 170,112
    M 86,112 L 86,156
    M 170,112 L 170,156
    M 86,156 L 128,188
    M 170,156 L 128,188
  "/>
  <!-- Cross-synapse connections linking to the central AI Core -->
  <path stroke="#ffffff" stroke-opacity="0.6" stroke-width="3.5" stroke-linecap="round" d="
    M 128,68 L 128,134
    M 86,112 L 128,134
    M 170,112 L 128,134
    M 86,156 L 128,134
    M 170,156 L 128,134
    M 128,188 L 128,134
  "/>

  <!-- 4. Apex AI Intelligence Spark (#818cf8) -->
  <path fill="#ffffff" d="
    M 128,52
    C 128,62 133,68 144,68
    C 133,68 128,74 128,84
    C 128,74 123,68 112,68
    C 123,68 128,62 128,52
    Z
  "/>

  <!-- 5. Peripheral Skill Nodes (Outer AI Agent Integrations) -->
  <circle cx="86" cy="112" r="7" fill="#ffffff"/>
  <circle cx="170" cy="112" r="7" fill="#ffffff"/>
  <circle cx="86" cy="156" r="7" fill="#ffffff"/>
  <circle cx="170" cy="156" r="7" fill="#ffffff"/>
  <circle cx="128" cy="188" r="8" fill="#ffffff"/>

  <!-- 6. Central Intelligence Nucleus / Keystone Portal -->
  <circle cx="128" cy="134" r="12" fill="#ffffff"/>
  <circle cx="128" cy="134" r="6" fill="#ffffff"/>
</svg>
